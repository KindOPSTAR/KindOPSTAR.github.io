name: Publish academic website
on:
  push:
    branches: [main]
    paths: ['website-source/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['website-source/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academic-site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: website-source
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website-source/package-lock.json
      - run: npm ci
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Refresh monthly Scholar metrics
        if: github.event_name != 'pull_request' && env.SERPAPI_API_KEY != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        id: scholar
        continue-on-error: true
        run: node scripts/sync-scholar.mjs
      - name: Record missing Scholar configuration
        if: github.event_name != 'pull_request' && env.SERPAPI_API_KEY == ''
        run: echo '::notice::Scholar sync awaits SERPAPI_API_KEY. The dated CV snapshot is retained.'
      - name: Record a successful Scholar update
        if: steps.scholar.outcome == 'success'
        run: |
          if ! git diff --quiet -- data/scholar.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/scholar.json
            git commit -m 'Update monthly Google Scholar metrics [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - run: npm run build
      - run: touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website-source/dist/client
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
